[versions]
jackson = "3.0.0"
jakarta-json-api = "2.1.3"

[libraries]
jacksonDependencies = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }

jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }

jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json-api" }
parsson = { module = "org.eclipse.parsson:parsson", version = "1.1.9" }

[bundles]
jackson = [
  "jackson-core",
  "jackson-databind"
]

jakarta = [
  "jakarta-json-api",
  "parsson"
]
